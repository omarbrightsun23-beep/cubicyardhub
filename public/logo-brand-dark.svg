<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="500" height="110">
  <defs>
    <!-- Cube linear gradients for 3D realism -->
    <linearGradient id="topFaceGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD4A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="leftFaceGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B9E"/>
      <stop offset="100%" stop-color="#003865"/>
    </linearGradient>
    <linearGradient id="rightFaceGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- 3D Isometric Cube Icon -->
  <g transform="translate(6, 12)">
    <!-- Top Face -->
    <polygon points="44,8 74,25 44,42 14,25" fill="url(#topFaceGradDark)" />
    <!-- Left Face -->
    <polygon points="14,25 44,42 44,78 14,61" fill="url(#leftFaceGradDark)" />
    <!-- Right Face -->
    <polygon points="44,42 74,25 74,61 44,78" fill="url(#rightFaceGradDark)" />
    
    <!-- Edge Accents -->
    <line x1="44" y1="8" x2="44" y2="42" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
    <line x1="14" y1="25" x2="44" y2="42" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <line x1="74" y1="25" x2="44" y2="42" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  </g>

  <!-- Wordmark "CubicYardHub" for Dark Backgrounds -->
  <g transform="translate(100, 56)">
    <!-- "CubicYard" -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">CubicYard</text>
    
    <!-- "Hub" -->
    <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#FBAF3C" letter-spacing="-1">Hub</text>

    <!-- ".COM" Pill Tag -->
    <g transform="translate(296, -35)">
      <rect width="82" height="42" rx="10" fill="#FBAF3C" />
      <text x="41" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#003865" text-anchor="middle" letter-spacing="0.5">.COM</text>
    </g>
  </g>

  <!-- Subtitle Tagline -->
  <text x="102" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" letter-spacing="2.5">UNIVERSAL MATERIAL &amp; TAKEOFF ENGINE</text>
</svg>
