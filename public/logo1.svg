  <text x="270" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#003865">Hub</text>
  <rect x="345" y="30" width="55" height="26" rx="6" fill="#FBAF3C" />
  <text x="354" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#2C3138">.COM</text>
  <text x="107" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#828892" letter-spacing="1.5">UNIVERSAL MATERIAL &amp; TAKEOFF ENGINE</text>
