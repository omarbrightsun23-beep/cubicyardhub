<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none">
  <!-- 3D Isometric Cube -->
  <g transform="translate(10, 8)">
    <!-- Top Face (Amber) -->
    <path d="M 36,0 L 72,18 L 36,36 L 0,18 Z" fill="#F5A623" />
    <!-- Left Face (Navy) -->
    <path d="M 0,18 L 36,36 L 36,74 L 0,56 Z" fill="#0A3663" />
    <!-- Right Face (Green) -->
    <path d="M 36,36 L 72,18 L 72,56 L 36,74 Z" fill="#1FB85D" />
  </g>

  <!-- Brand Typography -->
  <!-- "CubicYard" -->
  <text x="96" y="48" fill="#1E293B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">CubicYard</text>
  
  <!-- "Hub" -->
  <text x="278" y="48" fill="#0A3663" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">Hub</text>

  <!-- .COM Badge -->
  <rect x="346" y="24" width="70" height="28" rx="6" fill="#FFA726" />
  <text x="381" y="44" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" text-anchor="middle">.COM</text>

  <!-- Subtitle -->
  <text x="98" y="68" fill="#8A94A6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.8">UNIVERSAL MATERIAL &amp; TAKEOFF ENGINE</text>
</svg>